name: build-rapido

# Igual que build.yml pero con caché de compilados:
# - rust/target (los .so de Rust NO se recompilan si rust/ no cambió;
#   cargo decide por fingerprint, el caché solo evita partir de cero).
# - NDK 27.0.12077973 (no se reinstala en cada corrida).
# El mpv de media_kit ya viene prearmado en el paquete pub (nunca se
# compila; vive en el caché de pub). Primera corrida fría = lenta como
# build; desde la segunda, si no tocaste rust/, es mucho más rápida.
# SOLO manual desde la pestaña Actions.
on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            # Solo arm64: sin esto Flutter pasa los 3 ABIs a Gradle y
            # Cargokit compila Rust 3 veces (armv7 incluido).
            command: flutter build apk --release --target-platform android-arm64
    env:
      # Incremental SÍ (el runner lo trae en 0): con rust/target
      # cacheado, la recompra parcial es lo que ahorra tiempo.
      CARGO_INCREMENTAL: 1

    steps:
      - name: Free disk space
        if: matrix.target == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          df -h

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Toolchain Rust mínima para codegen (cargo-expand la necesita);
      # el build pesado de crates viene después del gate de análisis.
      - uses: dtolnay/rust-toolchain@stable

      # ------------------------------------------------------------- cache
      - name: Cache Dart pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-rapido-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-rapido-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache cargo-expand binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-v1

      - name: Cache Gradle
        if: matrix.target == 'android'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Los .so de Rust ya compilados: si rust/ no cambió, cargo no
      # recompila nada (fingerprint) y el link es lo único que corre.
      - name: Cache Rust target (Android arm64)
        if: matrix.target == 'android'
        uses: actions/cache@v5
        with:
          path: rust/target
          key: cargo-target-${{ runner.os }}-android-arm64-ndk27-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-android-arm64-ndk27-

      - name: Cache flutter_rust_bridge_codegen
        id: codegen-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/flutter_rust_bridge_codegen
          key: codegen-${{ runner.os }}-2.12.0

      # ---------------------------------------------------- codegen binary
      - name: Install codegen (Linux)
        if: runner.os == 'Linux' && steps.codegen-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.12.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.12.0.tgz" -o "$RUNNER_TEMP/frb.tgz"
          tar -xzf "$RUNNER_TEMP/frb.tgz" -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/flutter_rust_bridge_codegen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure codegen in PATH
        if: steps.codegen-cache.outputs.cache-hit == 'true'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------- dart + codegen
      - name: Fetch Dart packages
        run: flutter pub get

      # flutter_avif_android 3.1.0 trae Java 11 + un FlutterAvifPlugin.java
      # viejo duplicado del .kt (Redeclaration) y AGP 8 lo rechaza:
      # se borra el .java y se sube el Java a 17 en el pub-cache.
      - name: Parche JVM plugin avif
        run: |
          PC="$HOME/.pub-cache"
          F="$PC/hosted/pub.dev/flutter_avif_android-3.1.0/android/build.gradle"
          J="$PC/hosted/pub.dev/flutter_avif_android-3.1.0/android/src/main/java/com/teknorota/flutter_avif/FlutterAvifPlugin.java"
          [ -f "$J" ] && rm -v "$J" || echo "java ya ausente"
          if [ -f "$F" ]; then
            sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' "$F"
            grep -n "VERSION_17" "$F" | head -3
          else
            echo "aviso: no se halló $F"
          fi

      - name: Install cargo-expand (needed by codegen)
        run: |
          if ! command -v cargo-expand > /dev/null 2>&1; then
            cargo install cargo-expand
          fi

      - name: Generate Rust <-> Dart bindings
        run: flutter_rust_bridge_codegen generate

      # FAIL FAST: análisis Dart ANTES del build pesado (NDK, Rust, Gradle).
      # Los warnings no cortan el build; solo los errores.
      - name: Analyze Dart (fail fast)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ------------------------------------------------------------- build
      # set-android@v4 obsoleto: pide sdkmanager tools (Google lo borró).
      # El SDK Android ya viene con flutter-action; solo instalamos NDK.

      - name: Cache Android NDK
        id: ndk-cache
        if: matrix.target == 'android'
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/27.0.12077973
          key: ndk-27.0.12077973-${{ runner.os }}-v1

      - name: Accept Android licenses and install NDK
        if: matrix.target == 'android' && steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973" > /dev/null 2>&1 || true

      - name: Build ${{ matrix.target }}
        run: ${{ matrix.command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: pr_app-${{ matrix.target }}
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
