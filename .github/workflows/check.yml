name: check

# Chequeo RÁPIDO en cada push/PR: Dart + puente Rust, SIN compilar el APK.
# El build pesado (APK + Gradle + NDK) es manual: workflow build.yml.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: dart + puente rust (rápido)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: dtolnay/rust-toolchain@stable

      # ------------------------------------------------------------- cache
      - name: Cache Dart pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache cargo-expand binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-v1

      - name: Cache flutter_rust_bridge_codegen
        id: codegen-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/flutter_rust_bridge_codegen
          key: codegen-${{ runner.os }}-2.12.0

      - name: Install codegen
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.12.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.12.0.tgz" -o "$RUNNER_TEMP/frb.tgz"
          tar -xzf "$RUNNER_TEMP/frb.tgz" -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/flutter_rust_bridge_codegen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure codegen in PATH
        if: steps.codegen-cache.outputs.cache-hit == 'true'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------- dart + puente
      - name: Fetch Dart packages
        run: flutter pub get

      - name: Install cargo-expand (needed by codegen)
        run: |
          if ! command -v cargo-expand > /dev/null 2>&1; then
            cargo install cargo-expand
          fi

      - name: Generate Rust <-> Dart bindings
        run: flutter_rust_bridge_codegen generate

      - name: Analyze Dart (errores cortan, warnings no)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Solo chequeo de tipos Rust (sin NDK, sin Gradle, sin APK).
      - name: Cargo check (solo lib, rápido)
        run: cargo check --lib --manifest-path rust/Cargo.toml
