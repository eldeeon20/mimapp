[package]
name = "rust_lib_pr_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
candle-core = "0.8"
candle-nn = "0.8"
tokenizers = "0.20"
rand = "0.9"
# --- Gtool port (pinned igual que Gtool, probado en Android) ---
anyhow = "1"
sha2 = "0.10"
tokio = { version = "1.44.1", features = ["full"] }
pkarr = { version = "5.0.0", features = ["full"] }
nostr-sdk = { version = "=0.43.0", features = ["nip44", "nip59"] }
nostr = "=0.43.1"
shamirsecretsharing = "0.1"
rustls = { version = "0.23", features = ["ring"] }
nostringer = "0.1.8"
libcrux-kem = "0.0.7"
hf-hub = { version = "=1.0.0-rc.1", features = ["blocking"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "blocking"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
