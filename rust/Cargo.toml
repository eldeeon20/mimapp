[package]
name = "rust_lib_pr_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
candle-core = "0.8"
candle-nn = "0.8"
tokenizers = "0.20"
rand = "0.9"
# --- Gtool port (pinned igual que Gtool, probado en Android) ---
anyhow = "1"
sha2 = "0.10"
tokio = { version = "1.44.1", features = ["full"] }
pkarr = "=8.0.0"
aes-gcm = "0.10"
pbkdf2 = "0.12"
# --- Tool-calling local (Needle v2, 45M params, modelo .cact 13.7 MB) ---
needle-infer = { version = "0.2.1", features = ["parallel"] }
# --- Tor embebido (arti, cliente SOCKS5 local en localhost) ---
# LICENCIA: sin hs-pow-full ni experimental => árbol sin equix/hashx (los
# únicos LGPL de arti). Sin native-tls => cero OpenSSL; TLS = rustls+ring,
# el mismo stack que reqwest/librqbit ya usan. (Tablas inline TOML en UNA línea.)
arti = { version = "=1.7.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "static", "experimental-api"] }
arti-client = { version = "=0.36.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "static"] }
# HTTP(S) directo por arti, sin puente SOCKS local (lib oficial del proyecto Tor)
arti-ureq = { version = "=0.36.0", default-features = false, features = ["rustls", "tokio"] }
tor-rtcompat = { version = "=0.36.0", default-features = false, features = ["tokio", "rustls"] }
tor-config = "=0.36.0"
rlimit = "0.10"

nostr-sdk = { version = "=0.43.0", features = ["nip44", "nip59"] }
nostr = "=0.43.1"
shamirsecretsharing = "0.1"
rustls = { version = "0.23", features = ["ring"] }
nostringer = "0.1.8"
libcrux-kem = "0.0.7"
hf-hub = { version = "=1.0.0-rc.1", features = ["blocking"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "blocking", "socks"] }
# --- GPU compute (WebGPU/WGSL nativo, backend Vulkan en Android) ---
wgpu = "25"
half = "2"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
mainline = { path = "mainline" }
# --- Iroh P2P (cliente+servidor de blobs, QUIC + relays n0) ---
iroh = "1"
iroh-blobs = "0.103"
iroh-tickets = "1"
# --- BitTorrent (rqbit embebido, TLS rustls para Android) ---
serde_json = "1"
# --- Archives (RAR5/7z/ZIP/tar/gz/arj/lha/zoo... unificado) ---
unarc-rs = "0.6.1"
# http-api-client: igual que los defaults del desktop; habilita el módulo
# http_api_types (PeerStatsFilter) sin arrastrar axum.
librqbit = { version = "9", default-features = false, features = ["rust-tls", "http-api-client"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# unrar_sys 0.5.8 linkea -lpthread en todos los no-Windows; Android no tiene
# libpthread (va dentro de libc) y el link falla. Vendor parchado.
[patch.crates-io]
unrar_sys = { path = "vendor/unrar_sys" }
